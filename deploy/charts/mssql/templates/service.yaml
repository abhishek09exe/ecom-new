apiVersion: v1
kind: Service
metadata:
  name: {{ include "mssql.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: tds
      port: {{ .Values.service.port }}
      targetPort: 1433
  selector:
    {{- include "mssql.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mssql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: tds
      port: {{ .Values.service.port }}
      targetPort: 1433
  selector:
    {{- include "mssql.selectorLabels" . | nindent 4 }}
