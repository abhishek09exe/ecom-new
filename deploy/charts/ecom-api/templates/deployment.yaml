apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecom-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecom-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ecom-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecom-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ecom-api.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ .Values.service.name }}
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "ecom-api.fullname" . }}-config
          env:
            # Populates ConnectionStrings__EcomDb via the __ separator convention
            # so no code change is required to pick this up.
            - name: ConnectionStrings__EcomDb
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecretName }}
                  key: {{ .Values.db.secretKey }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.name }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.name }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
